<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune UI Interface</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CAJA DE DIÁLOGO PRINCIPAL -->
    <main class="dialogue-box">
        <p class="dialogue-text">
            <span class="asterisk">*</span>El viento sopla fuerte...
        </p>
        <p class="dialogue-text" style="color: #66ccff;">
            <span class="asterisk">*</span>(Sientes que un poder oscuro despierta en tu navegador web).
        </p>
    </main>

    <!-- BARRA DE ESTADÍSTICAS DEL PERSONAJE -->
    <section class="stats-container">
        <span class="char-name">KRIS</span>
        <span class="char-lv">LV 1</span>
        
        <span class="hp-label">HP</span>
        <div class="hp-bar-bg">
            <div class="hp-bar-fill"></div>
        </div>
        <span class="hp-numeric">90 / 90</span>
    </section>

    <!-- BOTONES DE ACCIÓN (INTERFAZ DE BATALLA) -->
    <nav class="action-menu">
        <button class="btn-action">Luchar</button>
        <button class="btn-action">Actuar</button>
        <button class="btn-action">Artículos</button>
        <button class="btn-action">Piedad</button>
    </nav>

</body>
</html>
